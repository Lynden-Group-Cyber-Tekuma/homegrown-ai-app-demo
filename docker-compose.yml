services:
  app:
    build: .
    ports:
      - "9100:8000"
    user: "0"   # entrypoint needs root to prepare /app/data, then drops to appuser via gosu
    volumes:
      - ./app:/app
    environment:
      # Fernet key for encrypting secrets at rest (PS API keys, LLM keys, JWT secret).
      # Generate:  python3 -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
      # Set in a .env file (never commit the actual key):  ENCRYPTION_KEY=<your-key>
      # WARNING: changing this key makes all previously encrypted DB values unreadable.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: hgapp
      POSTGRES_USER: hgapp
      POSTGRES_PASSWORD: hgapp_dev
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hgapp"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
